name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml', 'src/**', 'app/**', 'scripts/**', 'tests/**', '*.json', '*.gradle', '*.properties']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project structure
        run: test -f app/src/main/AndroidManifest.xml
