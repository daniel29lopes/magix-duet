plugins { id 'com.android.application' }
android {
 namespace 'pt.magix.duet'
 compileSdk 35
 defaultConfig { applicationId 'pt.magix.duet'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.2.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { debug { storeFile file(System.getProperty('user.home')+'/.android/magix-duet-development.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { debug { debuggable true }; release { minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation 'androidx.core:core:1.13.1' }
